services:
  postgres_order_service:
    image: postgres:15
    container_name: postgres_order_service
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata_order_service:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ${NETWORK_NAME}

  order-service:
    build: .
    image: order-service:latest
    container_name: order-service
    depends_on:
      postgres_order_service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres_order_service:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AUTH_SERVICE_VALIDATE_URL: ${AUTH_SERVICE_VALIDATE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      SERVER_PORT: ${ORDER_SERVER_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_PORT_INTERNAL}
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-group
      KAFKA_TOPIC_CREATE_ORDER: ${KAFKA_TOPIC_CREATE_ORDER}
      KAFKA_TOPIC_CREATE_PAYMENT: ${KAFKA_TOPIC_CREATE_PAYMENT}
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    networks:
      - ${NETWORK_NAME}

volumes:
  pgdata_order_service:

networks:
  app_network:
    external: true
