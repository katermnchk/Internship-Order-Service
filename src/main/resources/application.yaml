spring:
  application:
    name: InnowiseOrdersService

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

app:
  api:
    base-path: /api/v1
  auth-service:
    validate-url: ${AUTH_SERVICE_VALIDATE_URL}

user:
  service:
    url: ${USER_SERVICE_URL}
